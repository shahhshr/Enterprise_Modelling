<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Doctors</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f0ff;
        }

        h2 {
            text-align: center;
            color: #6a5acd;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #6a5acd;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2ff;
        }

        a {
            color: #6a5acd;
            text-decoration: none;
        }

        .top-btn {
            display: block;
            width: 180px;
            margin: 20px auto;
            text-align: center;
            background: #6a5acd;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h2>All Doctors</h2>

<a class="top-btn" href="/doctors/add">Add New Doctor</a>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Specialization</th>
        <th>Actions</th>
    </tr>

    <tr th:each="d : ${doctors}">
        <td th:text="${d.doctorId}"></td>
        <td th:text="${d.doctorName}"></td>
        <td th:text="${d.doctorEmail}"></td>
        <td th:text="${d.doctorMobile}"></td>
        <td th:text="${d.specialization}"></td>
        <td>
            <a th:href="@{'/doctors/edit/' + ${d.doctorId}}">Edit</a> |
            <a th:href="@{'/doctors/delete/' + ${d.doctorId}}">Delete</a>
        </td>
    </tr>
</table>

<br>
<a style="text-align:center; display:block;" href="/">Back</a>

</body>
</html>
