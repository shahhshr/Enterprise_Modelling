<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Patient</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f0ff;
        }

        .container {
            width: 40%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 40px;
        }

        h2 {
            text-align: center;
            color: #6a5acd;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
        }

        button {
            width: 100%;
            background-color: #6a5acd;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6a5acd;
        }
    </style>
</head>

<body>

<div class="container">
<h2>Edit Patient</h2>

<form th:action="@{/patients/update}" method="post" th:object="${patient}">
    
    ID: <input type="text" th:field="*{patientId}" readonly />
    Name: <input type="text" th:field="*{patientName}" />
    Email: <input type="text" th:field="*{patientEmail}" />
    Mobile: <input type="text" th:field="*{patientMobile}" />
    Address: <input type="text" th:field="*{patientAddress}" />

    <button type="submit">Update</button>
</form>

<a href="/patients/view">Back</a>
</div>

</body>
</html>
